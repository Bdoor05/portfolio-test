async function initStore(){
  const withT=(p)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),10000))]);
  let db=null,assets=null,user=null,dl=null;
  try{
    if(window.claude&&claude.use){
      [db,assets,user,dl]=await Promise.all([withT(claude.use('db')),withT(claude.use('assets')),withT(claude.use('user')),withT(claude.use('downloads'))]);
    }
  }catch(e){}
  S.db=db;S.assets=assets;S.dl=dl;
  if(user&&user.can){try{const w=await user.can('data.write');if(w===false)S.canWrite=false}catch(e){}}
  if(!db){S.mem=true;S.loaded=true;render();return}
  db.doc('settings/main').onSnapshot(s=>{if(s.exists){S.settings={...DEF_SET,...s.data()}}if(S.view!=='edit')safeRender()},()=>{});
  db.collection('pages').onSnapshot(snap=>{S.pages={};snap.docs.forEach(d=>{S.pages[d.id]=d.data()});if(S.view!=='edit')safeRender()},()=>{});
  db.collection('reports').onSnapshot(snap=>{
    S.reports=snap.docs.map(d=>({...d.data(),id:d.id}));S.loaded=true;
    if((S.view==='edit'||S.view==='view')&&!S.cur){const m=location.hash.match(/-([a-z0-9]+)$/);S.cur=byId(m&&m[1])||null;render()}
    else if(S.view==='edit'){updateLists()}else safeRender();

async function downloadDoc(list,filename,docTitle,cover){

  await Promise.all(jobs);
  const pages=(cover?coverHTML(cover.t,cover.s):'')+list.map(r=>reportHTML(r,{dl:true,img:e=>map[e.assetId]||('assets/'+e.assetId)})).join('\n');

   +'@page{size:A4;margin:0}@media print{body{background:#fff}.bar{display:none}.paper{margin:0;box-shadow:none;width:210mm;min-height:297mm;break-after:page}.paper:last-child{break-after:auto}}</style></head><body><div class="bar"><button onclick="window.print()">طباعة / حفظ PDF</button><span>اختاري «حفظ بصيغة PDF» من نافذة الطباعة، مقاس A4</span></div>'+pages+'</body></html>';

  const aG=g=>AREAS.filter(a=>a.g===g).map(a=>'<label><input type="checkbox" data-area="'+a.id+'"'+((r.areas||[]).includes(a.id)?' checked':'')+'><span>'+esc((a.g==='e'?a.n+'. ':'')+a.t)+'</span></label>').join('');
  const blocks=T.blocks.map(b=>b.t==='list'||b.t==='numlist'?listEd(r,b):b.t==='checks'?checksEd(r,b):b.t==='sections'?secsEd(r,b):fld(b.l,'<textarea class="in" id="b-'+b.k+'" data-f="'+b.k+'">'+esc(r.f[b.k]||'')+'</textarea>')).join('');
  return'<div class="fs"><h3>البيانات الأساسية <small>'+esc(T.name)+'</small></h3>'
   +fld(T.titleLabel||'عنوان التقرير','<input class="in" id="f-title" data-top="title" value="'+esc(r.title)+'" placeholder="'+esc(T.ph)+'">')
   +'<div class="row2">'+fld(T.docTitle?'تاريخ التنفيذ':'تاريخ التقرير','<input class="in" type="date" id="f-date" data-top="date" value="'+esc(r.date)+'"><small class="hij" id="hij-date">'+esc(fmtDate(r.date))+'</small>')
   +fld('الفصل الدراسي','<select class="in" id="f-term" data-top="term">'+opts(TERMS,r.term)+'</select>')+'</div>'
   +'<div class="row2">'+fld('الخصوصية','<select class="in" id="f-vis" data-top="vis"><option value="public"'+(r.vis!=='private'?' selected':'')+'>عام (يراه الزوار)</option><option value="private"'+(r.vis==='private'?' selected':'')+'>خاص (لي فقط)</option></select>')+fld('حالة النشر','<select class="in" id="f-status" data-top="status"><option value="published"'+(r.status!=='draft'?' selected':'')+'>منشور</option><option value="draft"'+(r.status==='draft'?' selected':'')+'>مسودة (لا تظهر للزوار)</option></select>')+'</div>'
   +'<div class="fld"><span>الربط بعناصر الملف</span><div class="glabel">عناصر الأداء الوظيفي</div><div class="areas">'+aG('e')+'</div><div class="glabel">أقسام أخرى</div><div class="areas">'+aG('s')+'</div></div></div>'
   +(T.info.length?'<div class="fs"><h3>بيانات التقرير</h3><div class="row2">'+infoEd(r,T)+'</div></div>':'')
   +'<div class="fs"><h3>المحتوى</h3>'+blocks+'</div>'
   +'<div class="fs"><h3>'+esc(T.evLabel||'الشواهد')+' <small>صور وروابط وملفات</small></h3><div id="evbox">'+evEd(r,T)+'</div></div>'
   +'<div class="fs"><h3>التوقيعات</h3><label class="chk"><input type="checkbox" id="f-sig" data-top="sigOn"'+(r.sigOn!==false?' checked':'')+'> إظهار صناديق التوقيع في التقرير</label><p class="note">الأسماء من صفحة الإعدادات.</p></div>';
}

function route(){
  const h=(location.hash||'#home').slice(1);
  let m;
  if((m=h.match(/^(edit|view)-([a-z0-9]+)$/))){
    S.view=m[1];S.cur=byId(m[2])||null;
    if(S.view==='edit'&&!S.canWrite){S.view='view'}
    S.tab='form';S.addLink=false;S.save='';imgBusy='';
  }else if((m=h.match(/^el-([a-z0-9]+)$/))){if(m[1]==='s07'){location.hash='#log';return}S.view='el';S.elId=m[1];S.cur=null}
  else{S.view=['home','about','perf','log','dash','reports','new','areas','evidence','settings'].includes(h)?h:'home';S.cur=null;if(h!=='new')S.newArea=''}
  render();window.scrollTo(0,0);
}

  if(act==='sec-add'){r.f.sections.push({h:'',kind:'text',v:''});rerenderForm(r,'sec-h-'+(r.f.sections.length-1));touch();return}
  if(act==='sec-del'){r.f.sections.splice(+b.dataset.i,1);if(!r.f.sections.length)r.f.sections=[{h:'',kind:'text',v:''}];rerenderForm(r);touch();return}

  if(act==='ev-del'){r.ev.splice(+b.dataset.i,1);refreshEv(r);touch();return}
  if(act==='ev-left'||act==='ev-right'){const i=+b.dataset.i,j=act==='ev-left'?i-1:i+1,a=r.ev;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];refreshEv(r);touch();return}
  if(act==='show-link'){S.addLink=!S.addLink;refreshEv(r);const u=$('#al-url');if(u)u.focus();return}
  if(act==='add-link'){const u=normUrl($('#al-url').value);if(!u){toast('أدخلي رابطًا صحيحًا');return}r.ev.push({id:uid(),kind:'link',url:u,cap:($('#al-cap').value||'').trim(),qr:true});S.addLink=false;refreshEv(r);touch();return}
  if(act==='dl1'){const x=byId(b.dataset.id)||r;if(!x)return;if(S.view==='edit'&&r){clearTimeout(saveTimer);persist(r)}await downloadDoc([x],'تقرير - '+safeName(x.title)+'.html',x.title||'تقرير');return}
  if(act==='dlarea'){const a=area(b.dataset.a);const list=sorted().filter(x=>(x.areas||[]).includes(a.id)).reverse();await downloadDoc(list,'شواهد - '+safeName(a.t)+'.html',a.t,{t:a.t,s:'شواهد ومرفقات'});return}
  if(act==='dlperf'){const list=sorted().filter(x=>(x.areas||[]).some(i=>AREA[i]&&AREA[i].g==='e')).reverse();await downloadDoc(list,'الأداء الوظيفي '+S.settings.year+'.html','الأداء الوظيفي',{t:'الأداء الوظيفي',s:'العام الدراسي '+S.settings.year+'هـ'});return}
  if(act==='dlall'){const list=sorted().reverse();await downloadDoc(list,'ملف الإنجاز '+S.settings.year+'.html','ملف الإنجاز',{t:'ملف الإنجاز والتميز المهني',s:'العام الدراسي '+S.settings.year+'هـ'});return}
  if(act==='backup'){if(!S.dl){toast('التنزيل غير متاح في هذا العرض');return}try{await S.dl.save({filename:'نسخة احتياطية - ملف الإنجاز.json',data:JSON.stringify({settings:S.settings,reports:S.reports},null,1)});toast('تم تجهيز النسخة')}catch(e){}return}
  if(act==='present'){S.present=!S.present;render();return}
  if(act==='back'){if(history.length>1)history.back();else location.hash='#home';return}
  if(act==='dlog'){await downloadLog(logList());return}
  if(act==='lb'){const rr=byId(b.dataset.r);const e=rr&&rr.ev.find(x=>x.id===b.dataset.e);if(e){S.lb={e,r:rr};render()}return}
  if(act==='lbx'){if(ev.target.closest('img,p'))return;S.lb=null;render();return}
});
function rerenderForm(r,focusId){
  const box=$('#formbox');if(!box)return;const y=window.scrollY;
  box.innerHTML=formHTML(r);window.scrollTo(0,y);
  if(focusId){const el=document.getElementById(focusId);if(el)el.focus()}
}
function refreshEv(r){const b=$('#evbox');if(b)b.innerHTML=evEd(r,TYPES[r.type])}
app0.addEventListener('input',e=>{
  const t=e.target,r=S.cur;
  if(t.id==='fq'){S.filter.q=t.value;const l=$('#rlist');if(l){const keep=S.view;render();const q=$('#fq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}return}
  if(t.dataset.pg){const id=t.dataset.pg;(S.pages[id]=S.pages[id]||{}).intro=t.value;clearTimeout(S.pT);S.pT=setTimeout(()=>savePage(id),700);return}
  if(t.dataset.ab){(S.pages.about=S.pages.about||{})[t.dataset.ab]=t.value;clearTimeout(S.pT);S.pT=setTimeout(()=>savePage('about'),700);return}
  if(t.dataset.set){S.settings[t.dataset.set]=t.value;clearTimeout(S.sT);S.sT=setTimeout(saveSettings,700);return}
  if(!r)return;
  const ch=()=>{schedule(r);updatePreview()};
  if(t.dataset.top){const k=t.dataset.top;if(k==='sigOn')r.sigOn=t.checked;else r[k]=t.value;if(k==='date'){const h=$('#hij-date');if(h)h.textContent=fmtDate(t.value)}if(k==='title'){const x=$('#edttl');if(x)x.textContent=t.value||'تقرير جديد'}ch();return}
  if(t.dataset.f){r.f[t.dataset.f]=t.value;if(t.dataset.hij){const h=$('#hij-'+t.dataset.f);if(h)h.textContent=fmtDate(t.value)}ch();return}
  if(t.dataset.list){r.f[t.dataset.list][+t.dataset.i]=t.value;ch();return}
  if(t.dataset.chk){const k=t.dataset.chk;const a=r.f[k]=r.f[k]||[];const v=t.dataset.v;const i=a.indexOf(v);if(t.checked&&i<0)a.push(v);if(!t.checked&&i>=0)a.splice(i,1);ch();return}
  if(t.dataset.area){const a=r.areas=r.areas||[];const v=t.dataset.area;const i=a.indexOf(v);if(t.checked&&i<0)a.push(v);if(!t.checked&&i>=0)a.splice(i,1);ch();return}
  if(t.dataset.sec!==undefined){const s=r.f.sections[+t.dataset.sec];s[t.dataset.sk]=t.value;if(t.dataset.sk==='kind')rerenderForm(r);ch();return}
  if(t.dataset.ecap!==undefined){r.ev[+t.dataset.ecap].cap=t.value;ch();return}
  if(t.dataset.eqr!==undefined){r.ev[+t.dataset.eqr].qr=t.checked;ch();return}
});
app0.addEventListener('change',async e=>{
  const t=e.target,r=S.cur;
  if(t.id==='lgy'){S.logF.type=t.value;render();return}
  if(t.id==='lgt'){S.logF.term=t.value;render();return}
  if(t.id==='ft'){S.filter.type=t.value;render();return}
  if(t.id==='fa'){S.filter.area=t.value;render();return}
  if(t.id==='fr'){S.filter.term=t.value;render();return}
  if(t.id==='efa'){S.evFilter.area=t.value;render();return}
  if(t.id==='eft'){S.evFilter.type=t.value;render();return}
  if(t.id==='up-img'&&r&&S.assets){const files=[...t.files];t.value='';let n=0;
    for(const f of files){n++;imgBusy='جارٍ رفع الصورة '+n+' من '+files.length+'…';refreshEv(r);
      try{const blob=await compress(f);const res=await S.assets.upload(blob,{priv:r.vis==='private'});r.ev.push({id:uid(),kind:'image',assetId:res.id,cap:''})}catch(err){toast('تعذر رفع '+f.name)}}
    imgBusy='';refreshEv(r);schedule(r);updatePreview();return}
  if(t.id==='up-pdf'&&r&&S.assets){const fs=[...t.files];t.value='';if(!fs.length)return;for(const f of fs){if(f.size>20*1024*1024){toast('حجم «'+f.name+'» أكبر من 20 ميغابايت');continue}imgBusy='جارٍ رفع '+f.name+'…';refreshEv(r);
    try{const res=await S.assets.upload(f,{priv:r.vis==='private'});r.ev.push({id:uid(),kind:'pdf',assetId:res.id,name:f.name,cap:f.name.replace(/\.pdf$/i,'')})}catch(err){toast('تعذر رفع '+f.name)}}
    imgBusy='';refreshEv(r);schedule(r);updatePreview();return}
  if(t.id==='imp'){const f=t.files[0];if(!f)return;try{const d=JSON.parse(await f.text());let n=0;
      if(d.settings){S.settings={...DEF_SET,...d.settings};await saveSettings()}
      for(const x of (d.reports||[])){if(!x.id||!x.type)continue;if(!byId(x.id))S.reports.push(x);if(!S.mem&&S.db)await S.db.doc('reports/'+x.id).set(clean(x));n++}
      toast('تمت استعادة '+n+' تقرير');render()}catch(err){toast('الملف غير صالح')}return}
});
app0.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter'&&t.dataset&&t.dataset.list){e.preventDefault();const k=t.dataset.list,r=S.cur;r.f[k].splice(+t.dataset.i+1,0,'');rerenderForm(r,'l-'+k+'-'+(+t.dataset.i+1));schedule(r);updatePreview()}
  if(e.key==='Escape'&&S.lb){S.lb=null;render()}
});
window.addEventListener('resize',()=>{if(S.view==='edit'||S.view==='view')fitPaper()});
async function compress(file,max=1600,q=.85){
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));const w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(bmp,0,0,w,h);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',q))}catch(e){return file}
}
const st=document.createElement('style');st.textContent=REPORT_CSS;document.head.appendChild(st);
S.loaded=false;route();initStore().then(()=>{route()});
